[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Pretty path for the proxy: the app calls /api/claude, Netlify routes it to the function.
[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200

# Single-page-app fallback so refreshes/deep links load the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
